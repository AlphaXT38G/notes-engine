name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"   # the oldest Python the engine supports
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk lmodern \
            texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended \
            texlive-fonts-extra texlive-science texlive-lang-french poppler-utils
      - name: Tests (builds the example notes repository)
        run: python -m unittest discover -s tests -v
      - name: The package installs and ships the page
        run: |
          pip install .
          cd example && notes-engine && test -s dist/index.html
